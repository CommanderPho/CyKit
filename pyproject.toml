[project]
name = "cykit"
version = "0.2.0"
requires-python = ">=3.9.0"
# Core dependencies needed for both data acquisition and visualization
dependencies = [
    "ipykernel>=6.29.5",
    "ipywidgets>=8.1.6",
    "panel>=1.4.5",
    "pathlib>=1.0.1",
    "pyvista>=0.45.0",
    "setuptools>=36.4.0",
    "wheel>=0.29.0",
]

[project.optional-dependencies]
# Data acquisition dependencies
acquisition = [
    "astroid==1.5.3",
    "certifi==2016.2.28",
    "isort==4.2.15",
    "lazy-object-proxy==1.3.1",
    "pip==9.0.1",
    "pylint==1.7.2",
    "setuptools==36.4.0",
    "singledispatch==3.4.0.3",
    "wheel==0.29.0",
    "wincertstore==0.2",
    "wrapt==1.10.11",
    "six==1.10.0",
]

# Visualization dependencies
visualization = [
