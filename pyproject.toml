[project]
name = "cykit"
version = "0.2.0"
requires-python = ">=3.7.9"
dependencies = [
    "astroid==1.5.3",
    "certifi==2016.2.28",
    "isort==4.2.15",
    "lazy-object-proxy==1.3.1",
    "pathlib>=1.0.1",
    "pip==9.0.1",
    "pylint==1.7.2",
    "setuptools==36.4.0",
    "singledispatch==3.4.0.3",
    "six==1.10.0",
    "wheel==0.29.0",
    "wincertstore==0.2",
    "wrapt==1.10.11",
    "pyvista==0.38.6",
    # PyVista optional dependencies for [all]
    "matplotlib>=3.0.1",
    "numpy>=1.19.0",
    "pillow",
    "imageio>=2.5.0",
    "colorcet",
    "cmocean",
    "vtk==8.1.2",
    "scooby>=0.5.1",
    "meshio>=5.2",
    "trimesh",
    #"pyacvd==0.2.11",
    "scipy",
    "tqdm",
    "pyvistaqt",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

